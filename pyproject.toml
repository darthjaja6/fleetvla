[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fleetvla"
version = "0.1.0.dev0"
description = "Simulator-first serving infrastructure for action-chunking robot policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FleetVLA contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fleetvla/fleetvla"
Documentation = "https://github.com/fleetvla/fleetvla#readme"
Issues = "https://github.com/fleetvla/fleetvla/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
smolvla = [
  "lerobot[smolvla] @ git+https://github.com/huggingface/lerobot.git@a16f34c085c9597fcbdb9fde395a3334d78df716 ; python_version >= '3.12'",
]
libero = [
  "cmake>=3.29,<4 ; python_version >= '3.12' and sys_platform == 'linux'",
  "lerobot[libero] @ git+https://github.com/huggingface/lerobot.git@a16f34c085c9597fcbdb9fde395a3334d78df716 ; python_version >= '3.12' and sys_platform == 'linux'",
]
ros2 = []

[project.scripts]
fleetvla = "fleetvla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetvla"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
