services:
  fleetvla:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.smolvla
    command: ["demo"]
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
